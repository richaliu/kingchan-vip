<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>test</title></head>
<body>
<div id="k" style="width:800px;height:500px;border:1px solid #ccc"></div>
<script src="/hqchart/umychart.min.js"></script>
<script>
window.onerror = function (msg) { document.title = 'JSERR:' + msg; };
try {
  if (typeof JSChart === 'undefined') { document.title = 'NO_JSChart'; }
  else {
    var c = JSChart.Init(document.getElementById('k'));
    var option = {
      type: 'kline',
      symbol: { code: '600519', name: '600519' },
      NetworkFilter: function (data, callback) {
        var cmd = data.Request.Command;
        if (cmd === 'KLineChartContainer::RequestHistoryData') {
          fetch('/api/kline?code=600519&period=daily&limit=1000')
            .then(function (r) { return r.json(); })
            .then(function (d) {
              var hq = { code: 0, data: [], symbol: '600519', name: '600519' };
              var yClose = null;
              (d.data || []).forEach(function (x) {
                var dateNum = parseInt(String(x.date).replace(/-/g, ''), 10);
                hq.data.push([dateNum, yClose, x.open, x.high, x.low, x.close, x.volume != null ? x.volume : x.vol, x.amount, 0]);
                yClose = x.close;
              });
              callback(hq);
            })
            .catch(function () { callback({ code: 0, data: [], symbol: '600519', name: '600519' }); });
        }
      },
      KLine: { MaxReqeustDataCount: 1000 }
    };
    c.SetOption(option);
    setTimeout(function () {
      document.title = 'OK_canvas=' + document.querySelectorAll('canvas').length;
    }, 4000);
  }
} catch (e) {
  document.title = 'ERR:' + e.message;
}
</script>
</body>
</html>
